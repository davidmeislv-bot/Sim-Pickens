name: Daily sims

on:
  schedule:
    # 16:17 UTC = 9:17 AM Pacific in summer (8:17 AM in winter). GitHub may start it a few minutes late.
    - cron: "17 16 * * *"
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab
    inputs:
      force:
        description: "Redo today's picks even if they already exist"
        type: boolean
        default: false
  push:                       # when you edit settings, the site, or results_manual.json
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-sims
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull odds, run sims, grade picks
        if: github.event_name != 'push'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m simpickens daily ${{ inputs.force && '--force' || '' }}

      - name: Grade picks only (after an edit)
        if: github.event_name == 'push'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m simpickens grade

      - name: Save picks to the repository
        run: |
          git config user.name "sim-pickens-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Picks and results $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
